<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Cloud Base Graphic with Shadow -->
  <g filter="url(#shadow)">
    <!-- Cloud Path -->
    <path d="M176 348 C140 348 112 320 112 284 C112 254 132 228 162 222 C172 176 212 144 260 144 C314 144 358 184 364 238 C390 244 408 268 408 296 C408 328 382 348 350 348 Z" fill="url(#cloudGrad)" />
  </g>

  <!-- POS Terminal & Smart Register in Center -->
  <g transform="translate(196, 204)">
    <!-- Terminal Body -->
    <rect x="0" y="0" width="120" height="156" rx="18" fill="#1e1b4b" />
    <rect x="4" y="4" width="112" height="148" rx="14" fill="#312e81" />
    
    <!-- Screen -->
    <rect x="14" y="16" width="92" height="56" rx="8" fill="#0f172a" />
    <!-- Screen Header & Lines -->
    <rect x="22" y="24" width="36" height="6" rx="3" fill="#38bdf8" />
    <circle cx="94" cy="27" r="4" fill="#10b981" />
    <text x="22" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff">$ 0.00</text>
    <rect x="22" y="56" width="76" height="4" rx="2" fill="#38bdf8" opacity="0.6" />

    <!-- Keypad Grid -->
    <circle cx="32" cy="90" r="7" fill="#475569" />
    <circle cx="60" cy="90" r="7" fill="#475569" />
    <circle cx="88" cy="90" r="7" fill="#475569" />

    <circle cx="32" cy="112" r="7" fill="#475569" />
    <circle cx="60" cy="112" r="7" fill="#475569" />
    <circle cx="88" cy="112" r="7" fill="#475569" />

    <circle cx="32" cy="134" r="7" fill="#ef4444" />
    <circle cx="60" cy="134" r="7" fill="#475569" />
    <circle cx="88" cy="134" r="7" fill="#10b981" />

    <!-- Receipt Paper Feed on Top -->
    <path d="M24 -24 L96 -24 L96 0 L24 0 Z" fill="#ffffff" opacity="0.95" />
    <path d="M24 -24 L30 -20 L36 -24 L42 -20 L48 -24 L54 -20 L60 -24 L66 -20 L72 -24 L78 -20 L84 -24 L90 -20 L96 -24" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <line x1="32" y1="-14" x2="88" y2="-14" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="-8" x2="74" y2="-8" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sync Wifi/Cloud Sparkle Badge -->
  <g transform="translate(320, 168)">
    <circle cx="20" cy="20" r="28" fill="#10b981" />
    <circle cx="20" cy="20" r="28" fill="none" stroke="#ffffff" stroke-width="3" />
    <!-- Checkmark icon -->
    <path d="M10 20 L17 27 L31 13" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark "POSCLOUD PRO" at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#ffffff">POSCLOUD PRO</text>
</svg>
